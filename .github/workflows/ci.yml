name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on the example exports
        run: |
          # the example has quotas above 95%, so exit code 2 is the expected result
          set +e
          gcp-quota-check examples/regions.json examples/project.json
          code=$?
          set -e
          test "$code" -eq 2
          gcp-quota-check examples/regions.json examples/project.json --format csv --all > /dev/null || [ $? -le 2 ]
          gcp-quota-check examples/regions.json --region europe-west1
